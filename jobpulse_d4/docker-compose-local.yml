services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jobpulse
      MYSQL_USER: jobuser
      MYSQL_PASSWORD: jobpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro

  web:
    build: ./backend
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: development
      DB_HOST: db
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=INFO"]
    volumes:
      - ./backend:/app
  celery_beat:
    build: ./backend
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "celery_app.celery", "beat", "--loglevel=INFO"]
    volumes:
      - ./backend:/app

volumes:
  db_data:
